{% extends "base.html" %}
{% block title %}Login — Secure Vault{% endblock %}
{% block content %}
<style>
  .auth-wrap {
    max-width: 440px; margin: 4rem auto;
    animation: slideUp .5s ease both;
  }
  @keyframes slideUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }
  .auth-logo {
    text-align: center; margin-bottom: 2rem;
    font-family: var(--mono); font-size: .8rem;
    color: var(--accent); letter-spacing: .15em;
  }
  .auth-logo .big { font-size: 2.5rem; display: block; margin-bottom: .5rem; }
  .divider { text-align: center; margin: 1.5rem 0; font-family: var(--mono); font-size: .75rem; color: var(--muted); }
</style>

<div class="auth-wrap">
  <div class="auth-logo">
    <span class="big">🔐</span>
    VAULT://AUTH — SIGN IN
  </div>

  <div class="card">
    <div class="card-header">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a8 8 0 0 0-16 0v2"/></svg>
      Credentials
    </div>

    <form method="POST">
      <div class="form-group">
        <label for="identifier">Username or Email</label>
        <input type="text" id="identifier" name="identifier" placeholder="user@example.com" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <div class="form-group mt-1">
        <label class="checkbox-label">
          <input type="checkbox" name="remember"> Remember me for 30 days
        </label>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:.5rem;">
        Authenticate →
      </button>
    </form>
  </div>

  <div class="divider">— No account? —</div>
  <div style="text-align:center">
    <a class="btn btn-secondary" href="{{ url_for('auth.register') }}">Create a Vault</a>
  </div>
</div>
{% endblock %}
